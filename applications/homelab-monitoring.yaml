apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: homelab-monitoring
spec:
  project: default
  source:
    repoURL: https://github.com/Oziel-Silva/homelab-gitops
    targetRevision: HEAD
    path: monitoring/homelab
    directory:
      recurse: true
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
