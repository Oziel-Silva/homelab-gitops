apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
  - name: homelab
    namespace: envoy-gateway-system
  hostnames:
  - alertmanager.127.0.0.1.sslip.io
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-alertmanager
      port: 9093
