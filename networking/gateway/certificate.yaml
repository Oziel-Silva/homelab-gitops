apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-tls
  namespace: envoy-gateway-system
spec:
  secretName: homelab-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  dnsNames:
  - "*.127.0.0.1.sslip.io"
  - "127.0.0.1.sslip.io"
